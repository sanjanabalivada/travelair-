<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passenger details — TravelGuard Air</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar" id="topbar"></div>
<div class="app-shell">
  <div class="step-rail" id="stepRail"></div>
  <h1>Passenger details</h1>
  <p class="lede">We'll use this to issue your ticket and send updates if your flight changes.</p>

  <div class="card">
    <label for="fullName">Full name (as on ID)</label>
    <input type="text" id="fullName" placeholder="e.g. Sanjana Rao">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">
    <label for="phone">Phone</label>
    <input type="tel" id="phone" placeholder="+91 9XXXXXXXXX">
    <p id="formError" style="display:none; color:var(--red); font-size:13px; margin:-8px 0 16px"></p>
    <button class="btn" id="continueBtn">Continue to payment</button>
  </div>
</div>
<script src="app.js"></script>
<script>
  renderTopbar();
  renderSteps(3);
  if (!getBooking().flight) window.location.href = 'select.html';

  const errorEl = document.getElementById('formError');
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }
  function clearError() {
    errorEl.style.display = 'none';
  }
  ['fullName', 'email', 'phone'].forEach(id => {
    document.getElementById(id).addEventListener('input', clearError);
  });

  document.getElementById('continueBtn').addEventListener('click', () => {
    const name = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();

    if (!name) return showError('Enter the passenger\'s full name.');
    if (!email || !email.includes('@')) return showError('Enter a valid email address.');
    if (!phone) return showError('Enter a phone number.');

    setBooking({ passenger: { name, email, phone } });
    window.location.href = 'payment.html';
  });
</script>
</body>
</html>
